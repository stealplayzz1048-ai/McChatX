<!DOCTYPE html>
<html>
<head>
    <title>McChat</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #111827;
            color: white;
        }

        header {
            background: #2563eb;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        #messages {
            height: 70vh;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            background: #1f2937;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
        }

        #inputArea {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            padding: 15px;
            box-sizing: border-box;
            background: #1f2937;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>💬 McChat</header>
<div id="online">
    🟢 Online: <span id="userList">Nobody</span>
</div>

<div id="messages"></div>

<div id="inputArea">
    <input id="message" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
    const socket = io();

    let username = prompt("Enter your username:");

    if (!username) {
    username = "Guest";
}
socket.emit("join", username);

    const input = document.getElementById("message");
    const messages = document.getElementById("messages");

    function sendMessage() {
        const text = input.value.trim();

        if (text === "") return;

        socket.emit("message", {
            username: username,
            text: text
        });

        input.value = "";
    }

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    socket.on("message", function(message) {
    const div = document.createElement("div");
    div.className = "message";
    div.textContent = message.username + ": " + message.text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
});

socket.on("users", function(users) {
    document.getElementById("userList").textContent =
        users.join(", ");
});
</script>

</body>
</html>
